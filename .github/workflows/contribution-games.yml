name: contribution games

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: draw the contribution graph as Pac-Man
        # v5.3.2, pinned to its commit so the code cannot change under us
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: count the past year's contributions for the badge
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { totalContributions } } } }' > count.json
          python3 - <<'EOF'
          import json
          total = json.load(open('count.json'))['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions']
          badge = {
              'schemaVersion': 1,
              'label': 'past year',
              'message': f'{total:,} contributions',
              'color': '216e39',
              'namedLogo': 'github',
              'logoColor': 'white',
          }
          with open('dist/contributions.json', 'w') as out:
              json.dump(badge, out)
          EOF

      - name: push the SVGs and the count to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m 'Draw the contribution games'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
